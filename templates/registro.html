<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Mi Tienda de Juegos</title>
    <!-- Esta línea conecta con tu archivo estilos.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <div class="navbar">
        <h1>Mi Tienda de Juegos</h1>
        <div>
            <a href="/login">Login</a>
        </div>
    </div>

    <div class="auth-wrapper" style="height: 80vh;">
        <div class="auth-card">
            <h2>Crear Cuenta</h2>
            
            <form method="POST" action="/registro">
                <input type="text" name="username" placeholder="Nuevo Usuario" required>
                <input type="password" name="password" placeholder="Nueva Contraseña" required>
                <button type="submit" class="btn btn-success">Registrarse</button>
            </form>
            <a href="/login">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>
</body>
</html>
