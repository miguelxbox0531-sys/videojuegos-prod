{% extends "maestra.html" %}
{% block titulo %}Editar juego{% endblock %}
{% block contenido %}
<section class="section">
    <div class="container">
        <h3 class="is-size-3">Editar juego</h3>
        <form action="{{ url_for('actualizar_juego') }}" method="post">
            <input type="hidden" name="id" value="{{ juego.id }}">
            <div class="field">
                <label class="label">Nombre:</label>
                <input value="{{ juego.nombre }}" required type="text" class="input" name="nombre">
            </div>
            <div class="field">
                <label class="label">Descripción:</label>
                <input value="{{ juego.descripcion }}" required type="text" class="input" name="descripcion">
            </div>
            <div class="field">
                <label class="label">Precio:</label>
                <input value="{{ juego.precio }}" required type="number" step="0.01" class="input" name="precio">
            </div>
            <button type="submit" class="button is-success mt-2">Guardar</button>
            <a href="{{ url_for('juegos') }}" class="button is-primary mt-2">Volver</a>
        </form>
    </div>
</section>
{% endblock %}
