<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Tienda de Juegos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <div class="navbar">
        <h1>Mi Tienda de Juegos</h1>
        <div>
            <a href="/juegos">Juegos</a>
            <a href="/logout">Cerrar Sesión</a>
        </div>
    </div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Lista de Juegos</h2>
            <a href="/agregar_juego" class="btn btn-success">+ Agregar Juego</a>
        </div>

        <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
            <thead>
                <tr style="border-bottom: 2px solid #eee; text-align: left;">
                    <th style="padding: 10px;">Nombre</th>
                    <th style="padding: 10px;">Descripción</th>
                    <th style="padding: 10px;">Precio</th>
                    <th style="padding: 10px;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for juego in juegos %}
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 10px;"><strong>{{ juego.nombre }}</strong></td>
                    <td style="padding: 10px;">{{ juego.descripcion }}</td>
                    <td style="padding: 10px;">${{ juego.precio }}</td>
                    <td style="padding: 10px;">
                        <a href="/formulario_editar_juego/{{ juego.id }}" class="btn btn-info" style="padding: 5px 10px; margin-top:0;">Editar</a>
                        <form action="/eliminar_juego" method="POST" style="display: inline;">
                            <input type="hidden" name="id" value="{{ juego.id }}">
                            <button type="submit" class="btn btn-danger" style="padding: 5px 10px; margin-top:0;" onclick="return confirm('¿Seguro que quieres eliminar este juego?')">Eliminar</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
