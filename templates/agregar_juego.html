{% extends "maestra.html" %}
{% block titulo %}Agregar juego{% endblock %}
{% block contenido %}
<section class="section">
    <div class="container">
        <h3 class="is-size-3">Agregar juego</h3>
        <form action="{{ url_for('guardar_juego') }}" method="post">
            <div class="field">
                <label class="label">Nombre:</label>
                <input required type="text" class="input" name="nombre" id="nombre">
            </div>
            <div class="field">
                <label class="label">Descripción:</label>
                <input required type="text" class="input" name="descripcion" id="descripcion">
            </div>
            <div class="field">
                <label class="label">Precio:</label>
                <input required type="number" step="0.01" class="input" name="precio" id="precio">
            </div>
            <button type="submit" class="button is-success mt-2">Guardar</button>
            <a href="{{ url_for('juegos') }}" class="button is-primary mt-2">Volver</a>
        </form>
    </div>
</section>
{% endblock %}
