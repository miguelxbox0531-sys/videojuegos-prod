version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: videojuegos
      MYSQL_USER: user
      MYSQL_PASSWORD: pwd
    volumes:
      - db_data:/var/lib/mysql
  web:
    build: .
    ports:
      - '80:8000'
    depends_on:
      - db
    restart: on-failure
    environment:
      DATABASE_URL: mysql+pymysql://user:pwd@db/videojuegos
      SECRET_KEY: 'cambia_esta_clave'
volumes:
  db_data: